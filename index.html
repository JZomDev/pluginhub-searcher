<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PluginHub Searcher</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
  <style>
    body{margin:0;min-height:100vh}
    #app{display:flex;flex-direction:column;min-height:100vh;padding:1rem;box-sizing:border-box}
    .content{flex:1}
    .footer{margin-top:2rem;padding-top:.75rem;border-top:1px solid #ddd;font-size:.9em;color:#666}
    .error{background-color:rgba(255,0,0,.5)}
    .toolbar{position:sticky;top:0;z-index:100;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.5rem;padding:.33rem .5rem;border-bottom:1px solid #ddd;background-color:#f5f5f5}
    .toolbar-item{display:flex;align-items:center;gap:.5rem;cursor:pointer;user-select:none;font-size:.9em;color:#333}
    .toolbar-item input[type="checkbox"]{margin:0;cursor:pointer}
    .toolbar-intro{font-size:.9em;color:#333}
    .search{margin-bottom:2em}
    .search-row{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem 1rem;width:calc(100% - 2em)}
    .search-row>input{flex:1 1 20em;min-width:0}
    .noselect{user-select:none}
    .result-summary{margin-top:1rem}
    .search-status{display:flex;align-items:center;gap:.4rem;flex:0 0 15em;white-space:nowrap;font-size:.9em;color:#555}
    .search-status.idle{visibility:hidden}
    .search-status.done{color:#1a7f37}
    .search-check{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:50%;background:#1a7f37;color:#fff;font-size:.8em;font-weight:bold}
    .spinner{width:.9em;height:.9em;border:2px solid #ccc;border-top-color:#0969da;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .index-status{display:flex;align-items:center;gap:.5rem}
    .index-bar{width:8rem;height:.5rem;border-radius:.25rem;background:#ddd;overflow:hidden}
    .index-bar-fill{display:block;height:100%;width:0;background:#0969da;transition:width .2s}
    .index-bar.paused .index-bar-fill{background:repeating-linear-gradient(45deg,#d4a72c 0 .4rem,#e8c766 .4rem .8rem)}
    .index-bar.done .index-bar-fill{background:#1a7f37}
    @media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}.index-bar-fill{transition:none}}
    .plugin-count,.line-count{margin-bottom:.5rem;cursor:pointer}
    .line-item{margin:.25rem 0}
    .line-item a{font-family:monospace;font-size:.9em}
    .summary-footer{margin-top:1rem;padding-top:.5rem;font-size:.9em;color:#666;text-align:center}
    .symbol-list{max-height:50em;overflow-y:auto;border:1px solid #ddd;padding:.5rem;margin-bottom:.5rem;background:#f9f9f9;font-family:monospace;font-size:.9em}
    .plugin-entry{margin:.25rem 0}
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar" aria-label="Search options">
      <span class="toolbar-intro">Search text within code of RuneLite's active plugins.<span id="plugin-count"></span></span>
      <span class="index-status toolbar-intro">
        <span id="index-bar" class="index-bar" role="progressbar" aria-label="Index download" aria-valuemin="0" aria-valuemax="100" hidden><span class="index-bar-fill"></span></span>
        <span id="index-status">Loading index…</span>
      </span>
      <label class="toolbar-item"><input id="regex" type="checkbox" checked> Regex</label>
      <label class="toolbar-item"><input id="case-sensitive" type="checkbox" checked> Case sensitive</label>
    </div>
    <div id="entries" class="content"></div>
    <footer class="footer">
      <a href="https://github.com/JZomDev/pluginhub-searcher2/commits/main">pluginhub-searcher2</a>
      <span id="index-updated"></span>
    </footer>
  </div>

  <script src="scripts/reverse-search-browser.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
