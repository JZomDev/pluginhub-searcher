name: Run Java then Python on Schedule

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with deploy.yml, so only one run updates or deploys at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your required Python version

      # Every step after this one is skipped when there are no updates.
      - name: Fetch plugin sources
        id: fetch
        run: |
          python3 builders/fetch_plugin_sources.py ./plugins/data ./plugins 2>&1 | tee /tmp/fetch-output.txt
          if [ "$(cat /tmp/fetch-output.txt)" = "No updates found" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build search index
        if: steps.fetch.outputs.updated == 'true'
        run: |
          python3 builders/build_reverse_index.py plugins/data plugins/index

      - name: Commit plugin data if changed
        if: steps.fetch.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins

          if ! git diff --cached --quiet; then
            COMMIT_MESSAGE=$(cat /tmp/fetch-output.txt)
            git commit -m "$COMMIT_MESSAGE"
            git push
          else
            echo "No changes to plugin data"
          fi

      - name: Assemble site
        if: steps.fetch.outputs.updated == 'true'
        run: |
          rm -rf _site
          mkdir -p _site/plugins
          cp index.html _site/
          cp -R scripts _site/
          cp -R plugins/index _site/plugins/

      - name: Upload site
        if: steps.fetch.outputs.updated == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.fetch.outputs.updated == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
