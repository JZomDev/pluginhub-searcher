name: Run Java then Python on Schedule

on:
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  run-java:
    runs-on: self-hosted
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # You can change this to 'corretto', 'zulu', etc.
          java-version: '17'      # Change to your required Java version (e.g., 11, 17, 21)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Specify your required Python version

      - name: Run JAR file
        run: |
          java -jar HubSearcher-all.jar ./plugins/data ./plugins ./plugins ./plugins/data 2>&1 | tee /tmp/java-output.txt

      - name: Run Python File
        run: |
          python3 build_reverse_index.py plugins/data plugins/index

      - name: Commit and push search index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . || true

          if ! git diff --cached --quiet; then
            COMMIT_MESSAGE=$(cat /tmp/java-output.txt)
            git commit -m "$COMMIT_MESSAGE"
            git push
          else
            echo "No changes to plugin data or search index"
          fi
