name: Deploy site

on:
  push:
    branches: [main]
    paths-ignore:
      - 'plugins/**' # Plugin data changes are deployed by the updater
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with updater.yml, so only one run updates or deploys at a time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The index isn't committed, so it's rebuilt from plugins/data.
      - name: Build search index
        run: |
          python3 builders/build_reverse_index.py plugins/data plugins/index

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir -p _site/plugins
          cp index.html _site/
          cp -R scripts _site/
          cp -R plugins/index _site/plugins/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
