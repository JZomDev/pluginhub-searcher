name: Build and commit search index 

on: 
  push: 
    branches: 
      - '**'

jobs: 
  build-index: 
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
    
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
    
      - name: Build search index
        run: |
          node scripts/build-search-index.js
    
      - name: Commit and push search index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/search-index.json.gz || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(search): update search-index.json.gz [skip ci]" || true
            git push
          else
            echo "No changes to search-index.json"
          fi
